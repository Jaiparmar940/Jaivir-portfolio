# GitHub Actions workflow disabled - using direct deployment from main branch
# The React app is built locally and deployed directly to the main branch root
# This avoids conflicts with existing gh-pages branch setup

name: Deploy React App to GitHub Pages

on:
  workflow_dispatch:  # Only run manually if needed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build
      run: npm run build
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
        force_orphan: true
