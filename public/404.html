<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect
      // This redirects any 404 to the main page and lets React Router handle the routing
      var l = window.location;
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/';
      
      // If there's a path beyond the domain, redirect to hash-based routing
      if (l.pathname && l.pathname !== '/') {
        redirectUrl += '#' + l.pathname + l.search + l.hash;
      }
      
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
    <p>If you are not redirected automatically, <a href="/">click here</a>.</p>
  </body>
</html>
